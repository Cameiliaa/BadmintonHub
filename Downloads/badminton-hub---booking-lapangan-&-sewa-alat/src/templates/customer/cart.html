  <!-- ==================== SHOPPING CART DRAWER ==================== -->
  <div id="cart-drawer-backdrop" onclick="toggleCartDrawer(false)" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 hidden transition-opacity duration-300"></div>
  <aside id="cart-drawer" class="fixed top-0 sm:top-3 right-0 sm:right-3 w-[88vw] sm:w-[410px] max-w-[430px] h-full sm:h-[calc(100vh-1.5rem)] bg-white z-50 shadow-2xl sm:rounded-3xl border-l sm:border border-slate-200/90 flex flex-col transform translate-x-full transition-transform duration-300 ease-out overflow-hidden">
    
    <!-- Drawer Header -->
    <div class="p-4 sm:p-5 border-b border-slate-200 flex items-center justify-between bg-slate-50/90 backdrop-blur-xs shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="p-2 rounded-xl bg-emerald-100 text-emerald-700 shadow-xs">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="font-extrabold text-slate-900 text-sm sm:text-base">Keranjang Pesanan</h3>
          <span id="cart-drawer-subtitle" class="text-xs text-slate-500">0 item dipilih</span>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="toggleCartDrawer(false)" class="px-2.5 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-200 text-xs font-semibold transition flex items-center gap-1" title="Tutup Keranjang">
          <span class="hidden sm:inline text-[11px]">Tutup</span>
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Promo Notice -->
    <div id="promo-notice-banner" class="bg-emerald-50 px-4 py-2.5 border-b border-emerald-100 flex items-center gap-2 text-xs text-emerald-800 font-semibold">
      <i data-lucide="percent" class="w-4 h-4 text-emerald-600 shrink-0"></i>
      <span id="promo-notice-text">Diskon 10% aktif untuk booking 2 jam atau lebih!</span>
    </div>

    <!-- Items List (Scrollable) -->
    <div id="cart-items-container" class="flex-grow overflow-y-auto p-4 space-y-3 custom-scrollbar">
      <!-- Injected via JavaScript -->
    </div>

    <!-- Drawer Footer (Subtotal & Actions) -->
    <div class="p-5 border-t border-slate-200 bg-slate-50 space-y-3">
      <div class="space-y-1.5 text-xs text-slate-600 font-medium">
        <div class="flex justify-between">
          <span>Subtotal</span>
          <span id="cart-subtotal-val" class="font-mono text-slate-900 font-bold">Rp 0</span>
        </div>
        <div id="cart-discount-row" class="flex justify-between text-emerald-600 font-bold hidden">
          <span>Diskon Promo (10%)</span>
          <span id="cart-discount-val" class="font-mono">- Rp 0</span>
        </div>
        <div class="flex justify-between text-base font-extrabold text-slate-900 pt-2 border-t border-slate-200">
          <span>Total Pembayaran</span>
          <span id="cart-grandtotal-val" class="font-mono text-emerald-600">Rp 0</span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 pt-1">
        <button onclick="clearCart()" class="py-2.5 px-3 rounded-xl border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-bold transition">
          Kosongkan
        </button>
        <button id="cart-checkout-btn" onclick="openCheckoutModal()" class="py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold transition shadow-md shadow-emerald-600/20 flex items-center justify-center gap-1.5">
          <span>Lanjut Pembayaran</span>
          <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

  </aside>
