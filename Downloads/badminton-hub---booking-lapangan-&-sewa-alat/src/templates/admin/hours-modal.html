  <!-- ==================== MODAL TAMBAH SLOT JAM OPERASIONAL ==================== -->
  <div id="hour-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-xs overflow-y-auto">
    <div class="bg-white rounded-3xl max-w-sm w-full shadow-2xl border border-slate-200 overflow-hidden my-8 transform transition-all">
      <div class="p-5 bg-slate-900 text-white flex items-center justify-between border-b border-slate-800">
        <div class="flex items-center gap-2.5">
          <div class="p-2 rounded-xl bg-blue-500 text-white font-bold">
            <i data-lucide="clock" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="font-extrabold text-base text-white">Tambah Slot Jam</h3>
            <p class="text-xs text-slate-400">Jam operasional baru arena</p>
          </div>
        </div>
        <button onclick="closeHourModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="hour-form" onsubmit="saveHourForm(event)" class="p-6 space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Format Slot Jam (HH:mm - HH:mm) <span class="text-red-500">*</span></label>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <span class="text-[11px] text-slate-500 block mb-0.5">Mulai:</span>
              <input type="text" id="hour-start-val" required placeholder="06:00" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:border-emerald-500 text-center font-mono font-bold" />
            </div>
            <div>
              <span class="text-[11px] text-slate-500 block mb-0.5">Selesai:</span>
              <input type="text" id="hour-end-val" required placeholder="07:00" class="w-full px-3 py-2 rounded-xl border border-slate-300 focus:border-emerald-500 text-center font-mono font-bold" />
            </div>
          </div>
          <p class="text-[11px] text-slate-400 mt-1.5">Contoh: 06:00 - 07:00 atau 23:00 - 00:00 (slot 1 jam).</p>
          <div class="flex items-center gap-1.5 flex-wrap pt-2">
            <span class="text-[10px] text-slate-400 font-bold">Preset Cepat:</span>
            <button type="button" onclick="setHourPreset('06:00', '07:00')" class="px-2 py-0.5 rounded bg-blue-50 hover:bg-blue-100 text-blue-700 text-[10px] font-medium font-mono border border-blue-200">06:00-07:00</button>
            <button type="button" onclick="setHourPreset('07:00', '08:00')" class="px-2 py-0.5 rounded bg-blue-50 hover:bg-blue-100 text-blue-700 text-[10px] font-medium font-mono border border-blue-200">07:00-08:00</button>
            <button type="button" onclick="setHourPreset('22:00', '23:00')" class="px-2 py-0.5 rounded bg-blue-50 hover:bg-blue-100 text-blue-700 text-[10px] font-medium font-mono border border-blue-200">22:00-23:00</button>
            <button type="button" onclick="setHourPreset('23:00', '00:00')" class="px-2 py-0.5 rounded bg-blue-50 hover:bg-blue-100 text-blue-700 text-[10px] font-medium font-mono border border-blue-200">23:00-00:00</button>
          </div>
        </div>

        <div class="p-3 bg-blue-50 rounded-xl border border-blue-200 text-blue-900 text-[11px] leading-relaxed">
          Slot jam ini akan otomatis diterapkan ke seluruh lapangan dan langsung dapat dipesan oleh penyewa.
        </div>

        <div class="grid grid-cols-2 gap-2 pt-2">
          <button type="button" onclick="closeHourModal()" class="py-2.5 px-3 rounded-xl border border-slate-300 hover:bg-slate-100 text-slate-700 font-bold transition">
            Batal
          </button>
          <button type="submit" class="py-2.5 px-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold transition shadow-md shadow-blue-600/20">
            Tambah Jam
          </button>
        </div>
      </form>
    </div>
  </div>
