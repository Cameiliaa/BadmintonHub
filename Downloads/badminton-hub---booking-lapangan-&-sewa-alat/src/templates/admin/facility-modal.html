  <!-- ==================== MODAL TAMBAH / EDIT FASILITAS ==================== -->
  <div id="facility-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-xs overflow-y-auto">
    <div class="bg-white rounded-3xl max-w-md w-full shadow-2xl border border-slate-200 overflow-hidden my-8 transform transition-all">
      <div class="p-5 bg-slate-900 text-white flex items-center justify-between border-b border-slate-800">
        <div class="flex items-center gap-2.5">
          <div class="p-2 rounded-xl bg-emerald-500 text-slate-950 font-bold">
            <i data-lucide="sparkles" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 id="facility-modal-title" class="font-extrabold text-base text-white">Tambah Fasilitas Baru</h3>
            <p class="text-xs text-slate-400">Atur judul, deskripsi, dan ikon fasilitas</p>
          </div>
        </div>
        <button onclick="closeFacilityModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="facility-form" onsubmit="saveFacilityForm(event)" class="p-6 space-y-4 text-xs">
        <input type="hidden" id="fac-form-id" value="" />

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Nama / Judul Fasilitas <span class="text-red-500">*</span></label>
          <input type="text" id="fac-form-title" required placeholder="Contoh: Loker Pintar & Ruang Ganti" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition text-xs" />
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Deskripsi Fasilitas <span class="text-red-500">*</span></label>
          <textarea id="fac-form-desc" rows="3" required placeholder="Jelaskan fasilitas dan kenyamanan yang disediakan untuk pemain..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition text-xs leading-relaxed"></textarea>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1.5">Pilih Ikon Fasilitas <span class="text-red-500">*</span></label>
          <input type="hidden" id="fac-form-icon" value="sun-medium" />
          <div id="fac-icon-options" class="grid grid-cols-4 gap-2">
            <!-- Rendered via JavaScript -->
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-2">
          <button type="button" onclick="closeFacilityModal()" class="py-2.5 px-3 rounded-xl border border-slate-300 hover:bg-slate-100 text-slate-700 font-bold transition">
            Batal
          </button>
          <button type="submit" class="py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold transition shadow-md shadow-emerald-600/20">
            Simpan Fasilitas
          </button>
        </div>
      </form>
    </div>
  </div>
