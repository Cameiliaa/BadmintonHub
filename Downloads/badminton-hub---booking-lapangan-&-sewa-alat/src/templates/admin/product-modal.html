  <!-- ==================== MODAL TAMBAH / EDIT BARANG SEWA & KAFE ==================== -->
  <div id="product-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-xs overflow-y-auto">
    <div class="bg-white rounded-3xl max-w-md w-full shadow-2xl border border-slate-200 overflow-hidden my-8 transform transition-all">
      <div class="p-5 bg-slate-900 text-white flex items-center justify-between border-b border-slate-800">
        <div class="flex items-center gap-2.5">
          <div class="p-2 rounded-xl bg-emerald-500 text-slate-950 font-bold">
            <i data-lucide="package" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 id="product-modal-title" class="font-extrabold text-base text-white">Tambah Barang Sewa / Kafe</h3>
            <p class="text-xs text-slate-400">Atur nama, tarif sewa/beli, dan satuan</p>
          </div>
        </div>
        <button onclick="closeProductModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="product-form" onsubmit="saveProductForm(event)" class="p-6 space-y-4 text-xs">
        <input type="hidden" id="prod-form-id" value="" />

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Nama Barang / Produk <span class="text-red-500">*</span></label>
          <input type="text" id="prod-form-name" required placeholder="Contoh: Sewa Sepatu Badminton Pro" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none transition text-xs" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Harga (Rp) <span class="text-red-500">*</span></label>
            <input type="number" id="prod-form-price" required min="1000" step="500" placeholder="15000" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-500 font-mono font-bold text-xs" />
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Satuan <span class="text-red-500">*</span></label>
            <input type="text" id="prod-form-unit" required placeholder="unit / sesi, slop, botol" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 focus:border-emerald-500 text-xs" />
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Deskripsi Produk</label>
          <textarea id="prod-form-desc" rows="2" placeholder="Jelaskan spesifikasi, keunggulan, atau ukuran..." class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:border-emerald-500 outline-none transition text-xs"></textarea>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">URL Foto Produk</label>
          <input type="text" id="prod-form-image" placeholder="/images/badminton_racket_pro_1790574262416.jpg" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:border-emerald-500 text-xs font-mono mb-1.5" />
          <div class="flex items-center gap-1.5 flex-wrap">
            <span class="text-[10px] text-slate-400">Pilih Preset:</span>
            <button type="button" onclick="setProductImagePreset('/images/badminton_racket_pro_1790574262416.jpg')" class="px-2 py-0.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 text-[10px] font-medium">🏸 Raket</button>
            <button type="button" onclick="setProductImagePreset('/images/shuttlecock_slop_1790574273437.jpg')" class="px-2 py-0.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 text-[10px] font-medium">🪶 Kok</button>
            <button type="button" onclick="setProductImagePreset('/images/mineral_water_bottle_1790574285717.jpg')" class="px-2 py-0.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 text-[10px] font-medium">💧 Air</button>
            <button type="button" onclick="setProductImagePreset('/images/hero_badminton_court_1790574248974.jpg')" class="px-2 py-0.5 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 text-[10px] font-medium">🏟️ Arena</button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-2">
          <button type="button" onclick="closeProductModal()" class="py-2.5 px-3 rounded-xl border border-slate-300 hover:bg-slate-100 text-slate-700 font-bold transition">
            Batal
          </button>
          <button type="submit" class="py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold transition shadow-md shadow-emerald-600/20">
            Simpan Barang
          </button>
        </div>
      </form>
    </div>
  </div>
