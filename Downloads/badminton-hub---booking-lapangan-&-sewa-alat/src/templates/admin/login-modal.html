  <div id="admin-login-modal" hidden role="dialog" aria-modal="true" aria-labelledby="admin-login-title" style="position:fixed;inset:0;z-index:100;background:#0f172acc;backdrop-filter:blur(6px);padding:24px;align-items:center;justify-content:center;">
    <form id="admin-login-form" style="background:white;border-radius:24px;padding:32px;width:100%;max-width:400px;box-shadow:0 24px 70px #0003;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2 id="admin-login-title" style="font-size:24px;font-weight:800;color:#0f172a">Login Admin</h2>
        <button type="button" id="admin-login-close" aria-label="Tutup login" style="padding:8px;font-size:24px">&times;</button>
      </div>
      <p style="color:#64748b;font-size:14px;margin-bottom:24px">Masuk untuk mengelola BadmintonHub.</p>
      <label for="admin-username" style="display:block;font-weight:600;font-size:14px">Username</label>
      <input id="admin-username" name="username" autocomplete="username" required maxlength="64" style="width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:12px;margin:8px 0 16px" />
      <label for="admin-password" style="display:block;font-weight:600;font-size:14px">Password</label>
      <input id="admin-password" name="password" type="password" autocomplete="current-password" required maxlength="256" style="width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:12px;margin:8px 0 16px" />
      <p id="admin-login-error" role="alert" style="color:#b91c1c;font-size:13px;margin-bottom:12px"></p>
      <button id="admin-login-submit" type="submit" style="width:100%;background:#059669;color:white;border-radius:12px;padding:12px;font-weight:700">Masuk</button>
    </form>
  </div>
