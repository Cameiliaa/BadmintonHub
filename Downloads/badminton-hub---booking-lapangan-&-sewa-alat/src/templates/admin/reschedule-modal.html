  <!-- ==================== MODAL RESCHEDULE BOOKING ==================== -->
  <div id="admin-reschedule-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-xs overflow-y-auto">
    <div class="bg-white rounded-3xl max-w-lg w-full shadow-2xl border border-slate-200 overflow-hidden my-8 transform transition-all">
      <div class="p-5 bg-slate-900 text-white flex items-center justify-between border-b border-slate-800">
        <div class="flex items-center gap-2.5">
          <div class="p-2 rounded-xl bg-blue-500 text-white font-bold">
            <i data-lucide="calendar-sync" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="font-extrabold text-base text-white">Reschedule Jadwal Booking</h3>
            <p class="text-xs text-slate-400">Pindahkan reservasi penyewa ke tanggal, lapangan, atau jam lain</p>
          </div>
        </div>
        <button onclick="closeRescheduleModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="reschedule-booking-form" onsubmit="saveRescheduleForm(event)" class="p-6 space-y-4 text-xs">
        <!-- Current Booking Badge -->
        <div class="p-3.5 bg-blue-50 border border-blue-200/90 rounded-2xl space-y-1">
          <div class="flex items-center justify-between">
            <span class="font-bold text-blue-950 font-mono text-[11px]" id="reschedule-booking-id">BHUB-XXXX</span>
            <span class="text-[10px] uppercase font-bold text-blue-800">Jadwal Lama</span>
          </div>
          <div class="font-bold text-slate-900 text-sm" id="reschedule-cust-name">-</div>
          <div class="text-[11px] text-blue-900 font-medium" id="reschedule-current-slot-info">-</div>
        </div>

        <div class="space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-200">
          <div class="font-bold text-slate-900 text-xs flex items-center gap-1.5">
            <i data-lucide="arrow-right-left" class="w-3.5 h-3.5 text-blue-600"></i>
            <span>Pilih Jadwal Baru:</span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Tanggal Baru <span class="text-red-500">*</span></label>
              <select id="reschedule-new-date" onchange="updateRescheduleAvailableHours()" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white font-semibold text-xs focus:border-blue-500 outline-none">
                <!-- Populated via JS -->
              </select>
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Lapangan Baru <span class="text-red-500">*</span></label>
              <select id="reschedule-new-court" onchange="updateRescheduleAvailableHours()" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white font-semibold text-xs focus:border-blue-500 outline-none">
                <!-- Populated via JS -->
              </select>
            </div>
          </div>

          <div>
            <label class="block font-semibold text-slate-700 mb-1">Slot Jam Baru <span class="text-red-500">*</span></label>
            <select id="reschedule-new-hour" required class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white font-mono font-bold text-xs focus:border-blue-500 outline-none">
              <!-- Populated via JS -->
            </select>
            <p class="text-[10px] text-slate-500 mt-1">Slot yang sudah dipesan otomatis dinonaktifkan (disabled).</p>
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Alasan Reschedule <span class="text-slate-400">(Dicatat di riwayat booking)</span></label>
          <input type="text" id="reschedule-reason-input" placeholder="Contoh: Permintaan pelanggan lewat WhatsApp karena dinas luar kota" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:border-blue-500 outline-none transition text-xs" />
        </div>

        <div class="grid grid-cols-2 gap-2 pt-2">
          <button type="button" onclick="closeRescheduleModal()" class="py-2.5 px-3 rounded-xl border border-slate-300 hover:bg-slate-100 text-slate-700 font-bold transition">
            Batal
          </button>
          <button id="reschedule-submit-btn" type="submit" class="py-2.5 px-3 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold transition shadow-md shadow-blue-600/20">
            Simpan Reschedule
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 space-y-2 pointer-events-none"></div>
